<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poems in Flight</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=DM+Sans:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #ffffff;
    --ink-faint: rgba(255,255,255,0.45);
    --paper: #002FA7;
  }

  html, body { height: 100%; background: var(--paper); color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif; }

  #shell { display: flex; height: 100vh; overflow: hidden; }

  /* ── Paper ── */
  #paper {
    flex: 1;
    overflow-y: auto;
    background: var(--paper);
    display: flex;
    justify-content: center;
    position: relative;
  }

  #poem-display {
    padding: 4rem 3rem 5rem;
    max-width: 560px;
    width: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
  }

  #ripple-canvas-host {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .poem-title {
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    margin-bottom: 3rem;
    font-style: italic;
    line-height: 1.8;
  }

  .poem-line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    line-height: 1;
    margin-bottom: 0.55rem;
  }
  .poem-line.spacer { height: 1.1rem; margin-bottom: 0; }
  .word-wrap { display: inline-flex; align-items: baseline; }
  .word-part {
    display: inline-block;
    font-size: 21px;
    font-style: italic;
    line-height: 1.65;
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    cursor: default;
    user-select: none;
    white-space: pre;
  }

  /* ── Floating menu trigger ── */
  #menu-trigger {
    position: fixed;
    top: 1.8rem;
    right: 2.2rem;
    z-index: 300;
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 999px;
    cursor: pointer;
    padding: 6px 18px 6px 16px;
    color: rgba(255,255,255,0.55);
    transition: color 0.2s, border-color 0.2s;
  }
  #menu-trigger:hover {
    border-color: rgba(255,255,255,0.55);
  }
  #trigger-label {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: #fff;
  }
  #trigger-arrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 9px;
    opacity: 0.5;
    transition: transform 0.22s ease;
    font-style: normal;
    line-height: 1;
  }
  #menu-trigger.open #trigger-arrow { transform: rotate(180deg); }
  #menu-trigger.open {
    border-color: rgba(255,255,255,0.5);
    color: rgba(255,255,255,0.9);
  }

  /* ── Dropdown panel ── */
  #menu-dropdown {
    position: fixed;
    top: 4.4rem;
    right: 2.2rem;
    min-width: 158px;
    background: rgba(0, 28, 138, 0.96);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 0.5px solid rgba(255,255,255,0.16);
    border-radius: 16px;
    padding: 1.1rem 1rem 0.9rem;
    z-index: 299;
    opacity: 0;
    transform: translateY(-8px) scale(0.97);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  #menu-dropdown.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .dropdown-label {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 9px;
    font-style: normal;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
    padding: 0 8px;
    margin-bottom: 0.5rem;
  }

  .mode-btn {
    display: block;
    width: 100%;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 15px;
    font-style: normal;
    font-weight: 400;
    padding: 5px 8px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: rgba(255,255,255,0.78);
    cursor: pointer;
    text-align: left;
    line-height: 1.5;
    letter-spacing: 0.01em;
    transition: color 0.15s, background 0.15s;
  }
  .mode-btn:hover {
    color: #fff;
    background: rgba(255,255,255,0.07);
  }
  .mode-btn.active {
    color: #fff;
    font-style: italic;
    background: rgba(255,255,255,0.11);
  }

  #reset-btn {
    position: fixed;
    bottom: 1.8rem;
    right: 2.2rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    padding: 6px 0;
    transition: color 0.2s;
    z-index: 300;
  }
  #reset-btn:hover {
    color: rgba(255,255,255,0.85);
  }


  /* ── Particles ── */
  .fly-particle {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 21px;
    color: var(--ink);
    white-space: pre;
    will-change: transform, opacity;
  }
</style>
</head>
<body>
<div id="shell">

  <div id="paper">
    <div id="poem-display"></div>
  </div>


</div>

<button id="menu-trigger" aria-haspopup="true" aria-expanded="false">
  <span id="trigger-label">moth</span>
  <span id="trigger-arrow">↓</span>
</button>

<div id="menu-dropdown" role="menu">
  <div class="dropdown-label">interaction</div>
  <button class="mode-btn active" data-mode="breakfree" role="menuitem">moth</button>
  <button class="mode-btn" data-mode="magnet" role="menuitem">magnet</button>
  <button class="mode-btn" data-mode="crumble" role="menuitem">crumble</button>
  <button class="mode-btn" data-mode="drop" role="menuitem">drop</button>
  <button class="mode-btn" data-mode="blossom" role="menuitem">blossom</button>
  <button class="mode-btn" data-mode="ripple" role="menuitem">ripple</button>
  <button class="mode-btn" data-mode="curious" role="menuitem">curious</button>
</div>

<button id="reset-btn">reset</button>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<script>
const poems = {
  breakfree: [
    ["The", "passion", "for", "butterflies", "is", "not", "easily", "explained."],
    ["It", "begins,", "perhaps,", "as", "most", "passions", "do,"],
    ["in", "a", "shimmer", "of", "colour", "seen", "at", "the", "edge", "of", "a", "wood,"],
    ["in", "a", "winged", "thing", "crossing", "a", "sunlit", "glade."],
    [],
    ["From", "the", "age", "of", "seven,", "everything", "in", "nature"],
    ["seemed", "to", "vibrate", "with", "a", "secret", "meaning"],
    ["that", "my", "parents", "could", "not", "explain."],
    ["The", "iridescent", "wings", "of", "a", "Camberwell", "Beauty"],

    ["were", "more", "real", "to", "me", "than", "anything", "I", "was", "taught."],
    [],

    ["Each", "name", "was", "a", "door", "opening", "into", "a", "bright", "corridor."],
    ["To", "know", "the", "name", "was", "to", "hold", "the", "creature", "still,"],

    ["That", "was", "the", "lesson."],
    ["The", "net", "sweeps", "through", "air,"],
    ["the", "hand", "closes,"],
    ["and", "the", "thing", "you", "wanted", "most"],
    ["is", "already", "somewhere", "else,"],

    [],
    ["There", "is", "a", "special", "rapture", "in", "the", "first", "sight"],

    ["The", "amateur", "is", "luckier", "than", "the", "professional:"],

    [],
    ["I", "have", "hunted", "them", "on", "the", "cliffs", "of", "the", "Crimea,"],

    [],
    ["The", "butterfly", "does", "not", "know", "it", "is", "beautiful."],

    ["And", "yet", "the", "pattern", "on", "its", "wings—"],

    ["Who", "made", "the", "world?"],

    ["who", "is", "gazing", "around", "with", "her", "enormous", "and", "complicated", "eyes."],
    [],
    ["Now", "she", "lifts", "her", "pale", "forearms", "and", "thoroughly", "washes", "her", "face."],
    ["Now", "she", "snaps", "her", "wings", "open,", "and", "floats", "away."],
    [],
    ["I", "don't", "know", "exactly", "what", "a", "prayer", "is."],
    ["I", "do", "know", "how", "to", "pay", "attention,", "how", "to", "fall", "down"],
    ["into", "the", "grass,", "how", "to", "kneel", "down", "in", "the", "grass,"],
    ["how", "to", "be", "idle", "and", "blessed,", "how", "to", "stroll", "through", "the", "fields,"],
    ["which", "is", "what", "I", "have", "been", "doing", "all", "day."],
    [],
    ["Tell", "me,", "what", "else", "should", "I", "have", "done?"],
    ["Doesn't", "everything", "die", "at", "last,", "and", "too", "soon?"],
    ["Tell", "me,", "what", "is", "it", "you", "plan", "to", "do"],
    ["with", "your", "one", "wild", "and", "precious", "life?"],
  ],

    ["I", "may", "not", "complete", "this", "last", "one"],
    ["but", "I", "give", "myself", "to", "it."],
    [],
    ["I", "circle", "around", "God,", "around", "the", "primordial", "tower."],
    ["I've", "been", "circling", "for", "thousands", "of", "years"],
    ["and", "I", "still", "don't", "know:", "am", "I", "a", "falcon,"],
    ["a", "storm,", "or", "a", "great", "song?"],
    [],
    ["I", "live", "my", "life", "in", "growing", "orbits"],
    ["which", "move", "out", "over", "the", "things", "of", "the", "world."],
    ["Perhaps", "I", "can", "never", "achieve", "the", "last,"],
    ["but", "that", "will", "be", "my", "attempt."],
    ["I", "am", "circling", "around", "God,", "around", "the", "ancient", "tower,"],
    ["and", "I", "have", "been", "circling", "for", "a", "thousand", "years,"],
    ["and", "I", "still", "do", "not", "know", "if", "I", "am", "an", "eagle", "or", "a", "storm"],
    ["or", "a", "great", "song."],
  ],
  magnet: [
    ["Tonight", "I", "can", "write", "the", "saddest", "lines."],
    ["Write,", "for", "example,", "'The", "night", "is", "starry,"],
    ["and", "the", "stars,", "blue,", "shiver", "in", "the", "distance.'"],
    [],
    ["The", "wind", "of", "the", "night", "rotates", "in", "the", "sky", "and", "sings."],
    ["Tonight", "I", "can", "write", "the", "saddest", "lines."],
    ["I", "loved", "her,", "and", "sometimes", "she", "loved", "me", "too."],
    [],
    ["Through", "nights", "like", "this", "one", "I", "held", "her", "in", "my", "arms."],
    ["I", "kissed", "her", "again", "and", "again", "under", "the", "endless", "sky."],
    ["She", "loved", "me,", "sometimes", "I", "loved", "her", "too."],
    ["How", "could", "one", "not", "have", "loved", "her", "great", "still", "eyes."],
    [],
    ["Tonight", "I", "can", "write", "the", "saddest", "lines."],
    ["To", "think", "that", "I", "do", "not", "have", "her.", "To", "feel", "that", "I", "have", "lost", "her."],
    ["To", "hear", "the", "immense", "night,", "still", "more", "immense", "without", "her."],
    ["And", "the", "verse", "falls", "to", "the", "soul", "like", "dew", "to", "the", "pasture."],
    [],
    ["What", "does", "it", "matter", "that", "my", "love", "could", "not", "keep", "her."],
    ["The", "night", "is", "starry,", "and", "she", "is", "not", "with", "me."],
    ["This", "is", "all.", "In", "the", "distance", "someone", "is", "singing.", "In", "the", "distance."],
    ["My", "soul", "is", "not", "satisfied", "that", "it", "has", "lost", "her."],
    [],
    ["Though", "this", "be", "the", "last", "pain", "that", "she", "makes", "me", "suffer"],
    ["and", "these", "the", "last", "verses", "that", "I", "write", "for", "her."],
  ],
  ripple: [
    ["This", "human", "being", "is", "a", "guest", "house."],
    ["Every", "morning", "a", "new", "arrival."],
    [],
    ["A", "joy,", "a", "depression,", "a", "meanness,"],
    ["some", "momentary", "awareness", "comes"],
    ["as", "an", "unexpected", "visitor."],
    [],
    ["Welcome", "and", "entertain", "them", "all!"],
    ["Even", "if", "they're", "a", "crowd", "of", "sorrows,"],
    ["who", "violently", "sweep", "your", "house"],
    ["empty", "of", "its", "furniture,"],
    ["still,", "treat", "each", "guest", "honorably."],
    ["He", "may", "be", "clearing", "you", "out"],
    ["for", "some", "new", "delight."],
    [],
    ["The", "dark", "thought,", "the", "shame,", "the", "malice,"],
    ["meet", "them", "at", "the", "door", "laughing,"],
    ["and", "invite", "them", "in."],
    [],
    ["Be", "grateful", "for", "whoever", "comes,"],
    ["because", "each", "has", "been", "sent"],
    ["as", "a", "guide", "from", "beyond."],
  ],

  curious: [
    ["Just", "off", "the", "highway", "to", "Rochester,", "Minnesota,"],
    ["Twilight", "bounds", "softly", "forth", "on", "the", "grass."],
    ["And", "the", "eyes", "of", "those", "two", "Indian", "ponies"],
    ["Darken", "with", "kindness."],
    ["They", "have", "come", "gladly", "out", "of", "the", "willows"],
    ["To", "welcome", "my", "friend", "and", "me."],
    ["We", "step", "over", "the", "barbed", "wire", "into", "the", "pasture"],
    ["Where", "they", "have", "been", "grazing", "all", "day,", "alone."],
    ["They", "ripple", "tensely,", "they", "can", "hardly", "contain", "their", "happiness"],
    ["That", "we", "have", "come."],
    ["They", "bow", "shyly", "as", "wet", "swans.", "They", "love", "each", "other."],

    ["At", "home", "once", "more,"],
    ["They", "begin", "munching", "the", "young", "tufts", "of", "spring", "in", "the", "darkness."],

    ["She", "is", "black", "and", "white,"],
    ["Her", "mane", "falls", "wild", "on", "her", "forehead,"],

  crumble: [
    ["The", "struggle", "was", "over."],

let currentMode = 'breakfree';

const titles = {
  breakfree: 'Speak, Memory — Vladimir Nabokov, 1951',
  drop:      'I Live My Life — Rainer Maria Rilke, 1905',
  blossom:   'The Summer Day — Mary Oliver, 1990',
  ripple:    'The Guest House — Rumi, 13th century',
  magnet:   'Tonight I Can Write — Pablo Neruda, 1924',
  crumble:  'The Death of the Moth — Virginia Woolf, 1942',
  curious:  'A Blessing — James Wright, 1963',
};


function setMode(m) {
  if (currentMode === 'ripple'  && m !== 'ripple')  destroyRipple();
  if (currentMode === 'magnet' && m !== 'magnet') destroyMagnet();
  if (currentMode === 'curious' && m !== 'curious') destroyCurious();
  currentMode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.mode-btn[data-mode="${m}"]`).classList.add('active');
  document.getElementById('trigger-label').textContent =
    document.querySelector(`.mode-btn[data-mode="${m}"]`).textContent.trim();
  resetPoem();
  if (m === 'ripple')  setTimeout(initRipple,  50);
  if (m === 'magnet') setTimeout(initMagnet, 50);
  if (m === 'curious') setTimeout(initCurious, 50);
}

function resetPoem() {
  raining   = false;
  crumbling = false;
  restoring = false;
  Object.keys(pileHeights).forEach(k => delete pileHeights[k]);
  document.querySelectorAll('.blossom-svg').forEach(el => el.remove());
  document.querySelectorAll('.crumble-letter').forEach(el => el.remove());
  if (currentMode === 'ripple')  destroyRipple();
  if (currentMode === 'magnet') destroyMagnet();
  if (currentMode === 'curious') destroyCurious();
  renderPoem();
  if (currentMode === 'ripple')  setTimeout(initRipple,  50);
  if (currentMode === 'magnet') setTimeout(initMagnet, 50);
  if (currentMode === 'curious') setTimeout(initCurious, 50);
}

function renderPoem() {
  const display = document.getElementById('poem-display');
  display.innerHTML = '';

  const title = document.createElement('p');
  title.className = 'poem-title';
  title.textContent = titles[currentMode];
  display.appendChild(title);

  const currentPoem = poems[currentMode];
  currentPoem.forEach(line => {
    const lineEl = document.createElement('div');
    if (line.length === 0) {
      lineEl.className = 'poem-line spacer';
      display.appendChild(lineEl);
      return;
    }
    lineEl.className = 'poem-line';
    line.forEach((word, wi) => {
      const wrap = document.createElement('span');
      wrap.className = 'word-wrap';
      const span = document.createElement('span');
      span.className = 'word-part';
      span.textContent = word + (wi < line.length - 1 ? '\u00a0' : '');
      span.dataset.word = word;
      span.dataset.gone = '0';
      span.addEventListener('mouseenter', onInteract);
      wrap.appendChild(span);
      lineEl.appendChild(wrap);
    });
    display.appendChild(lineEl);
  });
}

function onInteract(e) {
  const span = e.currentTarget;

  if (currentMode === 'breakfree') {
    if (span.dataset.gone === '1') return;
    span.dataset.gone = '1';
    const word  = span.dataset.word;
    const clean = word.replace(/[^a-zA-Z]/g, '');
    const rect  = span.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;
    span.style.visibility = 'hidden';
    if (clean.length <= 3) launchBee(clean, cx, cy);
    else {
      const parts = splitWord(clean);
      if (parts) launchButterfly(parts[0], parts[1], cx, cy);
      else launchBee(clean, cx, cy);
    }

  } else if (currentMode === 'drop') {
    cascadeRain();

  } else if (currentMode === 'blossom') {
    if (span.dataset.gone === '1') return;
    span.dataset.gone = '1';
    const rect = span.getBoundingClientRect();
    span.style.visibility = 'hidden';
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;
    placeBlossom(cx, cy);

  } else if (currentMode === 'ripple') {
    launchRipple(span);
  } else if (currentMode === 'magnet') {
    // Magnet mode updates continuously from mouse movement.
  } else if (currentMode === 'crumble') {
    cascadeCrumble();
  }
}

let raining    = false;
let crumbling  = false;
let restoring  = false;
const pileHeights   = {};
const PILE_BUCKET   = 20;
const letterOrigins = new WeakMap(); // letter el → { x, y }

function cascadeRain() {
  if (raining) return;
  raining = true;

  // Collect all word spans in DOM order, each with its position
  const allSpans = Array.from(
    document.querySelectorAll('#poem-display .word-part')
  );

  // Group by approximate vertical position (row) so words on the same
  // line start together, with a gentle stagger within each row
  // and a longer delay between rows — like rain falling in sheets
  const rows = [];
  let currentRow = [];
  let lastTop = null;

  allSpans.forEach(span => {
    const rect = span.getBoundingClientRect();
    const top = Math.round(rect.top / 8) * 8; // bucket by 8px
    if (lastTop === null || Math.abs(top - lastTop) < 12) {
      currentRow.push({ span, rect });
    } else {
      rows.push(currentRow);
      currentRow = [{ span, rect }];
    }
    lastTop = top;
  });
  if (currentRow.length) rows.push(currentRow);

  rows.forEach((row, rowIdx) => {
    row.forEach(({ span, rect }) => {
      // Row delay grows with row index — upper rows fall first
      // Word delay: tiny random scatter within a row
      const rowDelay  = rowIdx * 80;
      const wordJitter = Math.random() * 60;
      const delay = rowDelay + wordJitter;

      setTimeout(() => {
        if (span.dataset.gone === '1') return;
        span.dataset.gone = '1';
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        span.style.visibility = 'hidden';
        launchRain(span.dataset.word, cx, cy);
      }, delay);
    });
  });

  // Re-enable after animation completes
  const totalDuration = rows.length * 80 + 2000;
  setTimeout(() => { raining = false; }, totalDuration);
}

function splitWord(clean) {
  if (clean.length <= 4) return null;
  const mid = Math.floor(clean.length / 2);
  return [clean.slice(0, mid), clean.slice(mid)];
}

/* ── BEE ── */
function launchBee(text, x, y) {
  const el = document.createElement('div');
  el.className = 'fly-particle';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  el.style.transform = 'translate(-50%,-50%)';
  document.body.appendChild(el);
  const baseAngle = (Math.random() * 2 - 1) * Math.PI;
  let vx = Math.cos(baseAngle) * 1.4, vy = Math.sin(baseAngle) * 1.4 - 0.5;
  let bx = x, by = y, t = 0, wobble = Math.random() * 100;
  function step() {
    t++; wobble += 0.2;
    vx += Math.sin(wobble * 1.5) * 0.15;
    vy += Math.cos(wobble) * 0.1 - 0.012;
    const spd = Math.sqrt(vx*vx + vy*vy);
    if (spd > 2.8) { vx = vx/spd*2.8; vy = vy/spd*2.8; }
    bx += vx; by += vy;
    const opacity = Math.max(0, 1 - t / 160);
    el.style.left = bx + 'px'; el.style.top = by + 'px';
    el.style.transform = `translate(-50%,-50%) rotate(${Math.sin(wobble*0.7)*18}deg)`;
    el.style.opacity = opacity;
    if (opacity > 0.01) requestAnimationFrame(step); else el.remove();
  }
  requestAnimationFrame(step);
}

/* ── BUTTERFLY ──
   Both halves pivot at their inner edge (the split point).
   Left half drifts left, right half drifts right.
   Each flaps around its inner edge: rotate ± angle.
*/
function launchButterfly(left, right, cx, cy) {
  const lEl = document.createElement('div');
  const rEl = document.createElement('div');
  lEl.className = rEl.className = 'fly-particle';
  lEl.textContent = left;
  rEl.textContent = right;

  lEl.style.visibility = rEl.style.visibility = 'hidden';
  document.body.appendChild(lEl);
  document.body.appendChild(rEl);
  const lRect = lEl.getBoundingClientRect();
  const lW = lRect.width;
  const h  = lRect.height;
  lEl.style.visibility = rEl.style.visibility = '';

  // Left half: inner edge = right side → pivot at (lW, h/2) within element
  // Right half: inner edge = left side → pivot at (0, h/2) within element
  lEl.style.transformOrigin = 'right center';
  rEl.style.transformOrigin = 'left center';

  const driftSpeed = 1.0 + Math.random() * 0.5;
  const driftUp    = 0.35 + Math.random() * 0.25;

  let t = 0;
  let lPivotX = cx, lPivotY = cy;
  let rPivotX = cx, rPivotY = cy;

  function step() {
    t += 0.05;

    lPivotX -= driftSpeed + Math.sin(t * 1.3) * 0.3;
    lPivotY -= driftUp + Math.sin(t * 2.0) * 0.2;
    rPivotX += driftSpeed + Math.sin(t * 1.1) * 0.3;
    rPivotY -= driftUp + Math.sin(t * 1.8) * 0.2;

    // Flap angle: oscillate ±25° around 0 — pure up/down wing beat
    const flapAngle = Math.sin(t * 9) * 25;

    const opacity = Math.max(0, 1 - t / 4.2);

    // Left: pivot (right edge center) sits at lPivotX, lPivotY
    lEl.style.left      = (lPivotX - lW) + 'px';
    lEl.style.top       = (lPivotY - h / 2) + 'px';
    lEl.style.transform = `rotate(${-flapAngle}deg)`;
    lEl.style.opacity   = opacity;

    // Right: pivot (left edge center) sits at rPivotX, rPivotY
    rEl.style.left      = rPivotX + 'px';
    rEl.style.top       = (rPivotY - h / 2) + 'px';
    rEl.style.transform = `rotate(${flapAngle}deg)`;
    rEl.style.opacity   = opacity;

    if (opacity > 0.01) requestAnimationFrame(step);
    else { lEl.remove(); rEl.remove(); }
  }
  requestAnimationFrame(step);
}

/* ── RAIN ──
   Word falls from its position under gravity to the bottom of the viewport.
   On impact it bursts into small dot droplets that scatter and fade.
*/
function launchRain(text, x, y) {
  const el = document.createElement('div');
  el.className = 'fly-particle';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  el.style.transform = 'translate(-50%,-50%)';
  document.body.appendChild(el);

  const floor = window.innerHeight - 16;
  let vy = 2 + Math.random() * 1.5;
  let by = y;

  function fall() {
    vy *= 1.055;
    by += vy;
    const wobbleX = Math.sin(by * 0.018) * 1.8;
    el.style.left      = (x + wobbleX) + 'px';
    el.style.top       = by + 'px';
    el.style.transform = `translate(-50%,-50%) rotate(${wobbleX * 0.8}deg)`;

    if (by < floor) {
      requestAnimationFrame(fall);
    } else {
      el.remove();
      splashRain(x + wobbleX, floor);
    }
  }
  requestAnimationFrame(fall);
}

function splashRain(x, y) {
  const count = 10 + Math.floor(Math.random() * 6);
  for (let i = 0; i < count; i++) {
    const dot = document.createElement('div');
    const size = 1.5 + Math.random() * 2.5;
    dot.style.cssText = `position:fixed;pointer-events:none;z-index:9999;
      width:${size}px;height:${size}px;border-radius:50%;background:var(--ink);
      left:${x}px;top:${y}px;transform:translate(-50%,-50%);`;
    document.body.appendChild(dot);

    // Full 360° scatter with upward bias
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.6;
    const speed = 1.2 + Math.random() * 4.5;
    let vx = Math.cos(angle) * speed;
    let vy = Math.sin(angle) * speed;
    let dx = x, dy = y, t = 0;
    const life = 32 + Math.floor(Math.random() * 18);

    function dropStep() {
      t++;
      vy += 0.15; // gentle gravity on droplets
      vx *= 0.98; // slight air resistance
      dx += vx; dy += vy;
      const opacity = Math.max(0, 1 - t / life);
      dot.style.left    = dx + 'px';
      dot.style.top     = dy + 'px';
      dot.style.opacity = opacity;
      if (opacity > 0.01) requestAnimationFrame(dropStep); else dot.remove();
    }
    requestAnimationFrame(dropStep);
  }
}

/* ── BLOSSOM ── */
function makeBlossom(size) {
  const ns  = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  const dim = size * 7;
  svg.setAttribute('width',  dim);
  svg.setAttribute('height', dim);
  svg.style.cssText = 'position:fixed;pointer-events:none;z-index:9998;overflow:visible;';
  svg.classList.add('blossom-svg');

  const cx = dim / 2, cy = dim / 2;
  const n   = 5 + Math.floor(Math.random() * 2);
  const baseAngle = Math.random() * Math.PI * 2;

  const petalRx = size * 0.48;   // width of petal (short axis)
  const petalRy = size * 0.95;   // length of petal (long axis, points outward)
  const offset  = size * 1.0;    // center-to-petal-center distance

  for (let i = 0; i < n; i++) {
    const angle = baseAngle + (i / n) * Math.PI * 2;
    const angleDeg = angle * (180 / Math.PI);

    // Petal center along the radial direction
    const px = cx + Math.cos(angle) * offset;
    const py = cy + Math.sin(angle) * offset;

    // Ellipse drawn upright (long axis = vertical = ry),
    // then rotated so its long axis aligns with the radial direction.
    // SVG rotate(deg, pivotX, pivotY) rotates around the ellipse center.
    const ellipse = document.createElementNS(ns, 'ellipse');
    ellipse.setAttribute('cx', px);
    ellipse.setAttribute('cy', py);
    ellipse.setAttribute('rx', petalRx);
    ellipse.setAttribute('ry', petalRy);
    // Rotate the ellipse around its own center so long axis points outward.
    // Upright ellipse long axis is at 90°, so we need angleDeg - 90.
    ellipse.setAttribute('transform',
      `rotate(${angleDeg - 90}, ${px}, ${py})`);
    ellipse.setAttribute('fill', 'none');
    ellipse.setAttribute('stroke', '#ffffff');
    ellipse.setAttribute('stroke-width', '1.4');
    ellipse.setAttribute('stroke-linecap', 'round');
    svg.appendChild(ellipse);
  }

  // Center circle
  const dot = document.createElementNS(ns, 'circle');
  dot.setAttribute('cx', cx);
  dot.setAttribute('cy', cy);
  dot.setAttribute('r',  size * 0.26);
  dot.setAttribute('fill', 'none');
  dot.setAttribute('stroke', '#ffffff');
  dot.setAttribute('stroke-width', '1.2');
  svg.appendChild(dot);
  return svg;
}

function placeBlossom(x, y) {
  const size = 6 + Math.random() * 6;
  const svg  = makeBlossom(size);
  const half  = (size * 6) / 2;
  const rot   = Math.random() * 360;

  // Place flower centered on the word's position, stays fixed there
  svg.style.left            = (x - half) + 'px';
  svg.style.top             = (y - half) + 'px';
  svg.style.transformOrigin = `${half}px ${half}px`;
  svg.style.transform       = `rotate(${rot}deg) scale(0)`;
  svg.style.opacity         = '1';
  document.body.appendChild(svg);

  // Bloom in only — no drift, no fade, stays on canvas
  let t = 0;
  const bloomDur = 18;

  function bloom() {
    t++;
    const ease = 1 - Math.pow(1 - Math.min(t / bloomDur, 1), 3);
    svg.style.transform = `rotate(${rot}deg) scale(${ease})`;
    if (t < bloomDur) requestAnimationFrame(bloom);
  }
  requestAnimationFrame(bloom);
}

/* ── RIPPLE (p5 overlay + text displacement) ── */
const rippleWaves  = [];
let   rippleRafId  = null;
let   rippleActive = false;
let   rippleSketch = null;
let   lastRippleAt = 0;
const rippleCooldownMs = 120;
const maxRippleWaves = 10;

function ensureRippleSketch() {
  if (rippleSketch || typeof p5 === 'undefined') return;
  const paper = document.getElementById('paper');
  const host = document.createElement('div');
  host.id = 'ripple-canvas-host';
  paper.appendChild(host);

  rippleSketch = new p5((p) => {
    let canvas;

    p.setup = () => {
      canvas = p.createCanvas(paper.clientWidth, paper.clientHeight);
      canvas.parent(host);
      p.clear();
      p.noFill();
      p.strokeWeight(1.1);
    };

    p.draw = () => {
      p.clear();
      if (!rippleActive) return;
      const now = performance.now() / 1000;
      rippleWaves.forEach((w) => {
        const age = now - w.born;
        if (age < 0 || age > w.life) return;
        const t = age / w.life;
        const alpha = 120 * (1 - t);
        const baseRadius = 14 + age * 230;

        // Draw several irregular rings instead of perfect circles so the
        // ripple feels more fluid and less geometric.
        drawOrganicRing(w, now, baseRadius, alpha, 0);
        drawOrganicRing(w, now, baseRadius * 0.78, alpha * 0.7, 1.7);
        drawOrganicRing(w, now, baseRadius * 1.18, alpha * 0.45, 3.3);
      });
    };

    p.windowResized = () => {
      p.resizeCanvas(paper.clientWidth, paper.clientHeight);
    };

    function drawOrganicRing(wave, now, radius, alpha, seedShift) {
      const points = 64;
      const wobble = 3.5 + radius * 0.012;
      p.stroke(255, 255, 255, alpha);
      p.noFill();
      p.beginShape();
      for (let i = 0; i <= points; i++) {
        const a = (i / points) * p.TWO_PI;
        const nx = Math.cos(a) * 0.65 + wave.seed + seedShift;
        const ny = Math.sin(a) * 0.65 + now * 0.9 + wave.seed * 0.2;
        const n = p.noise(nx, ny) - 0.5;
        const localR = radius + n * wobble;
        const x = wave.lx + Math.cos(a) * localR;
        const y = wave.ly + Math.sin(a) * localR;
        p.vertex(x, y);
      }
      p.endShape();
    }
  });
}

function initRipple() {
  rippleActive = true;
  ensureRippleSketch();
  if (!rippleRafId) rippleRafId = requestAnimationFrame(tickRipple);
}

function destroyRipple() {
  rippleActive = false;
  if (rippleRafId) { cancelAnimationFrame(rippleRafId); rippleRafId = null; }
  rippleWaves.length = 0;
  // Reset all spans
  document.querySelectorAll('#poem-display .word-part').forEach(s => {
    s.style.transform = '';
    s.style.display   = '';
  });
}

function tickRipple() {
  if (!rippleActive) return;
  const now  = performance.now() / 1000;
  const spans = Array.from(document.querySelectorAll('#poem-display .word-part'));

  // Remove dead waves
  for (let i = rippleWaves.length - 1; i >= 0; i--) {
    if (now - rippleWaves[i].born > rippleWaves[i].life) rippleWaves.splice(i, 1);
  }

  spans.forEach(span => {
    const rect = span.getBoundingClientRect();
    const sx   = rect.left + rect.width  / 2;
    const sy   = rect.top  + rect.height / 2;

    let totalDY = 0;
    let totalDX = 0;

    rippleWaves.forEach(w => {
      const age  = now - w.born;
      if (age < 0 || age > w.life) return;

      const dx   = sx - w.x;
      const dy   = sy - w.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Wave equation: sin(k*dist - omega*age) * envelope
      const k       = 0.032;
      const omega   = 7.0;
      const sigma   = 180;
      const timeFade = Math.max(0, 1 - age / w.life);
      const envelope = Math.exp(-dist / sigma) * timeFade;
      // Suppress wave at the origin itself — near-field = 0
      const nearSuppress = Math.min(1, dist / 40);
      const phase    = k * dist - omega * age;
      const wave     = Math.sin(phase) * envelope * w.amp * nearSuppress;

      // Displace radially outward from origin
      if (dist > 0.5) {
        totalDX += wave * (dx / dist);
        totalDY += wave * (dy / dist);
      } else {
        totalDY += wave;
      }
    });

    span.style.transform = `translate(${totalDX.toFixed(2)}px, ${totalDY.toFixed(2)}px)`;
  });

  rippleRafId = requestAnimationFrame(tickRipple);
}

function launchRipple(span) {
  const nowMs = performance.now();
  if (nowMs - lastRippleAt < rippleCooldownMs) return;
  lastRippleAt = nowMs;

  const rect = span.getBoundingClientRect();
  const paperRect = document.getElementById('paper').getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top  + rect.height / 2;

  // If two triggers are nearly in the same place, reinforce the latest wave
  // instead of creating a brand-new ripple every time.
  const nearest = rippleWaves[rippleWaves.length - 1];
  if (nearest) {
    const dx = nearest.x - x;
    const dy = nearest.y - y;
    const d2 = dx * dx + dy * dy;
    if (d2 < 26 * 26) {
      nearest.born = performance.now() / 1000;
      nearest.amp = Math.min(nearest.amp + 0.8, 7.5);
      nearest.life = Math.min(nearest.life + 0.1, 2.8);
      nearest.lx = x - paperRect.left;
      nearest.ly = y - paperRect.top;
      nearest.x = x;
      nearest.y = y;
      return;
    }
  }

  if (rippleWaves.length >= maxRippleWaves) {
    rippleWaves.shift();
  }

  rippleWaves.push({
    x,
    y,
    lx:   x - paperRect.left,
    ly:   y - paperRect.top,
    seed: Math.random() * 1000,
    born: performance.now() / 1000,
    life: 2.4,
    amp:  4 + Math.random() * 3,
  });
}

/* ── GRAVITY ──
   Each word has a rest position and a current position.
   Mouse acts as an attractor — words are pulled toward it,
   with force proportional to 1/distance².
   Spring force pulls each word back to its rest position.
   Velocity is damped each frame.
*/
let magnetActive  = false;
let magnetRafId   = null;
let magnetMouse   = { x: -9999, y: -9999 };
let magnetParticles = [];

function initMagnet() {
  magnetActive = true;

  // Build particles from current spans
  magnetParticles = [];
  document.querySelectorAll('#poem-display .word-part').forEach(span => {
    const rect = span.getBoundingClientRect();
    const ox = rect.left + rect.width  / 2;
    const oy = rect.top  + rect.height / 2;
    magnetParticles.push({
      span,
      ox, oy,       // rest position (screen coords, updated each frame via original layout)
      dx: 0, dy: 0, // displacement from rest
      vx: 0, vy: 0, // velocity
    });
    span.style.display = 'inline-block';
    span.style.transition = 'none';
  });

  document.addEventListener('mousemove', onMagnetMouse);
  document.addEventListener('mouseleave', onMagnetLeave);
  magnetRafId = requestAnimationFrame(tickMagnet);
}

function destroyMagnet() {
  magnetActive = false;
  if (magnetRafId) { cancelAnimationFrame(magnetRafId); magnetRafId = null; }
  document.removeEventListener('mousemove', onMagnetMouse);
  document.removeEventListener('mouseleave', onMagnetLeave);
  magnetParticles.forEach(p => {
    p.span.style.transform = '';
  });
  magnetParticles = [];
}

function onMagnetMouse(e) {
  magnetMouse.x = e.clientX;
  magnetMouse.y = e.clientY;
}

function onMagnetLeave() {
  magnetMouse.x = -9999;
  magnetMouse.y = -9999;
}

function tickMagnet() {
  if (!magnetActive) return;

  const mx = magnetMouse.x;
  const my = magnetMouse.y;
  const G  = 80000;   // magnetic constant — much stronger pull
  const k  = 0.08;    // spring stiffness (return force)
  const damping = 0.72; // less damping = snappier response

  magnetParticles.forEach(p => {
    // Current world position of the word
    const wx = p.ox + p.dx;
    const wy = p.oy + p.dy;

    // Vector from word to mouse
    const toMx = mx - wx;
    const toMy = my - wy;
    const dist  = Math.sqrt(toMx * toMx + toMy * toMy) + 1;

    // Gravitational pull — stronger when closer, but capped so words don't teleport
    const force  = Math.min(G / (dist * dist), 12.0);
    const ax = (toMx / dist) * force;
    const ay = (toMy / dist) * force;

    // Spring restore toward rest position
    const sx = -k * p.dx;
    const sy = -k * p.dy;

    // Integrate
    p.vx = (p.vx + ax + sx) * damping;
    p.vy = (p.vy + ay + sy) * damping;
    p.dx += p.vx;
    p.dy += p.vy;

    p.span.style.transform = `translate(${p.dx.toFixed(2)}px, ${p.dy.toFixed(2)}px)`;
  });

  magnetRafId = requestAnimationFrame(tickMagnet);
}


/* ── CRUMBLE ──
   First hover triggers the whole poem to collapse from the last word backwards.
   Each word's letters detach last-to-first and fall under gravity,
   landing at the bottom where they pile up with natural overlap.
*/
function cascadeCrumble() {
  if (crumbling) return;
  crumbling = true;

  const allSpans = Array.from(document.querySelectorAll('#poem-display .word-part'));

  // Group spans into rows by vertical position (bucket to 10px)
  const rowMap = new Map();
  allSpans.forEach(span => {
    const top = Math.round(span.getBoundingClientRect().top / 10) * 10;
    if (!rowMap.has(top)) rowMap.set(top, []);
    rowMap.get(top).push(span);
  });

  // Sort rows top→bottom, then reverse so we start from the bottom row
  const rows = [...rowMap.entries()]
    .sort((a, b) => a[0] - b[0])
    .map(([, spans]) => spans)
    .reverse();

  // Snake order: bottom row right→left, next row left→right, etc.
  const ordered = [];
  rows.forEach((row, i) => {
    ordered.push(...(i % 2 === 0 ? [...row].reverse() : row));
  });

  ordered.forEach((span, idx) => {
    setTimeout(() => {
      if (span.dataset.gone === '1') return;
      crumbleWord(span);
    }, idx * 38);
  });

  setTimeout(() => { crumbling = false; }, ordered.length * 38 + 1500);
}

function crumbleWord(span) {
  if (span.dataset.gone === '1') return;
  span.dataset.gone = '1';

  const word = span.dataset.word;
  const rect = span.getBoundingClientRect();
  span.style.visibility = 'hidden';

  for (let i = 0; i < word.length; i++) {
    const letter = word[i];
    if (letter === ' ') continue;

    const letterX = rect.left + ((i + 0.5) / word.length) * rect.width;
    const letterY = rect.top  + rect.height / 2;
    // Last letter falls first
    const delay = (word.length - 1 - i) * 28;
    setTimeout(() => launchCrumbleLetter(letter, letterX, letterY), delay);
  }
}

function launchCrumbleLetter(letter, x, y) {
  const el = document.createElement('div');
  el.className   = 'fly-particle crumble-letter';
  el.textContent = letter;
  letterOrigins.set(el, { x, y });
  el.style.left      = x + 'px';
  el.style.top       = y + 'px';
  el.style.transform = 'translate(-50%,-50%)';
  document.body.appendChild(el);

  const floor  = window.innerHeight - 10;
  let vy  = 2.5 + Math.random() * 2;
  let vx  = (Math.random() - 0.5) * 0.8;
  let cx  = x, cy = y;
  const restAngle = (Math.random() - 0.5) * 30;

  function fall() {
    vy += 0.28;
    cy += vy;
    cx += vx;
    vx *= 0.98;

    el.style.left      = cx + 'px';
    el.style.top       = cy + 'px';
    el.style.transform = `translate(-50%,-50%) rotate(${restAngle.toFixed(1)}deg)`;

    if (cy < floor) {
      requestAnimationFrame(fall);
    } else {
      const bucket = Math.round(cx / PILE_BUCKET) * PILE_BUCKET;
      if (!pileHeights[bucket]) pileHeights[bucket] = floor;
      const settleY = pileHeights[bucket];
      pileHeights[bucket] -= 10 + Math.random() * 3;

      el.style.top           = settleY + 'px';
      el.style.left          = (cx + (Math.random() - 0.5) * 3) + 'px';
      el.style.transform     = `translate(-50%,-50%) rotate(${restAngle.toFixed(1)}deg)`;
      el.style.pointerEvents = 'auto';
      el.style.cursor        = 'pointer';
    }
  }
  requestAnimationFrame(fall);
}

/* ── CURIOUS ──
   Words rotate in place toward the cursor — like animals turning to look.
   Each word has its own boldness; bolder words lean further.
   Inside the comfort zone they tilt away (looking away shyly).
   No translation: the poem stays readable, only posture changes.
*/
let curiousActive    = false;
let curiousRafId     = null;
let curiousMouse     = { x: -9999, y: -9999 };
let curiousParticles = [];

const C_RADIUS     = 175;  // sensing distance
const C_COMFORT    = 68;   // too-close threshold
const C_MAX_LEAN   = 26;   // max rotation degrees toward cursor
const C_AWAY_LEAN  = 14;   // max rotation degrees away when too close
const C_SMOOTH     = 0.07; // interpolation speed (lower = lazier)

function initCurious() {
  curiousActive = true;
  curiousParticles = [];
  document.querySelectorAll('#poem-display .word-part').forEach(span => {
    const rect = span.getBoundingClientRect();
    curiousParticles.push({
      span,
      ox: rect.left + rect.width  / 2,
      oy: rect.top  + rect.height / 2,
      boldness: 0.45 + Math.random() * 0.55,
      angle: 0,
      scale: 1,
    });
    span.style.display         = 'inline-block';
    span.style.transition      = 'none';
    span.style.transformOrigin = 'center bottom';
  });
  document.addEventListener('mousemove',  onCuriousMouse);
  document.addEventListener('mouseleave', onCuriousLeave);
  curiousRafId = requestAnimationFrame(tickCurious);
}

function destroyCurious() {
  curiousActive = false;
  if (curiousRafId) { cancelAnimationFrame(curiousRafId); curiousRafId = null; }
  document.removeEventListener('mousemove',  onCuriousMouse);
  document.removeEventListener('mouseleave', onCuriousLeave);
  curiousParticles.forEach(p => {
    p.span.style.transform      = '';
    p.span.style.transformOrigin = '';
  });
  curiousParticles = [];
}

function onCuriousMouse(e) { curiousMouse.x = e.clientX; curiousMouse.y = e.clientY; }
function onCuriousLeave()  { curiousMouse.x = -9999;     curiousMouse.y = -9999; }

function tickCurious() {
  if (!curiousActive) return;
  const mx = curiousMouse.x;
  const my = curiousMouse.y;

  curiousParticles.forEach(p => {
    const toMx = mx - p.ox;
    const toMy = my - p.oy;
    const dist  = Math.sqrt(toMx * toMx + toMy * toMy) + 0.001;

    // Horizontal lean direction: right = clockwise, left = counterclockwise
    const hDir = toMx / dist;

    let targetAngle = 0;
    let targetScale = 1;

    if (dist < C_COMFORT) {
      // Too close — tilt away, shrink slightly
      const away = 1 - dist / C_COMFORT;
      targetAngle = -hDir * C_AWAY_LEAN * away;
      targetScale = 1 - 0.06 * away;
    } else if (dist < C_RADIUS) {
      // In range — lean toward cursor; peaks at midpoint
      const t        = (dist - C_COMFORT) / (C_RADIUS - C_COMFORT);
      const envelope = Math.sin(t * Math.PI);
      targetAngle = hDir * C_MAX_LEAN * envelope * p.boldness;
      targetScale = 1 + 0.06 * envelope * p.boldness;
    }

    p.angle += (targetAngle - p.angle) * C_SMOOTH;
    p.scale += (targetScale - p.scale) * C_SMOOTH;

    p.span.style.transform = `rotate(${p.angle.toFixed(2)}deg) scale(${p.scale.toFixed(3)})`;
  });

  curiousRafId = requestAnimationFrame(tickCurious);
}

// Bind mode buttons
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    setMode(btn.dataset.mode);
    closeMenu();
  });
});
document.getElementById('reset-btn').addEventListener('click', resetPoem);

// Dropdown open / close
const menuTrigger  = document.getElementById('menu-trigger');
const menuDropdown = document.getElementById('menu-dropdown');

function openMenu() {
  menuTrigger.classList.add('open');
  menuTrigger.setAttribute('aria-expanded', 'true');
  menuDropdown.classList.add('open');
}

function closeMenu() {
  menuTrigger.classList.remove('open');
  menuTrigger.setAttribute('aria-expanded', 'false');
  menuDropdown.classList.remove('open');
}

menuTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  menuDropdown.classList.contains('open') ? closeMenu() : openMenu();
});

document.addEventListener('click', (e) => {
  if (!menuDropdown.contains(e.target) && e.target !== menuTrigger) closeMenu();
});


renderPoem();

// Click the pile → letters try to rise home, fail, fall back down
document.addEventListener('click', e => {
  if (e.target.classList.contains('crumble-letter') && !restoring) {
    attemptRestore();
  }
});

function attemptRestore() {
  restoring = true;
  const letters = Array.from(document.querySelectorAll('.crumble-letter'));
  letters.forEach(el => { el.style.pointerEvents = 'none'; });

  letters.forEach((el, i) => {
    setTimeout(() => attemptLetterRise(el), i * 5);
  });

  // Re-enable clicking once all arcs have settled
  setTimeout(() => {
    letters.forEach(el => { el.style.pointerEvents = 'auto'; });
    restoring = false;
  }, letters.length * 5 + 2200);
}

function attemptLetterRise(el) {
  const fromX = parseFloat(el.style.left);
  const fromY = parseFloat(el.style.top);
  const { x: toX, y: toY } = letterOrigins.get(el);
  const fromAngle = parseFloat(
    (el.style.transform.match(/rotate\(([-\d.]+)/) ?? ['', '0'])[1]
  );

  // Phase 1: ease-out lerp toward origin — same motion as the old restore,
  // but only travels reach% of the way before giving up.
  const reach = 0.55 + Math.random() * 0.2; // 55–75% of the way home
  const dur1  = 22 + Math.random() * 12;
  let t = 0;

  function tryRise() {
    t++;
    const p  = Math.min(t / dur1, 1);
    const e  = 1 - Math.pow(1 - p, 3); // ease-out cubic
    const ep = e * reach;               // scaled to reach%

    const cx = fromX + (toX - fromX) * ep;
    const cy = fromY + (toY - fromY) * ep;
    el.style.left      = cx + 'px';
    el.style.top       = cy + 'px';
    el.style.transform = `translate(-50%,-50%) rotate(${(fromAngle * (1 - ep)).toFixed(1)}deg)`;

    if (t < dur1) {
      requestAnimationFrame(tryRise);
    } else {
      fallBack(cx, cy, fromAngle * (1 - ep));
    }
  }

  // Phase 2: letter ran out of energy — gravity takes it back down
  function fallBack(startX, startY, peakAngle) {
    const floor = window.innerHeight - 10;
    // Small residual velocity toward origin so it strains briefly before dropping
    const remainDx = toX - startX;
    const remainDy = toY - startY;
    const remainDist = Math.max(Math.sqrt(remainDx * remainDx + remainDy * remainDy), 1);
    let vx = (remainDx / remainDist) * 1.2;
    let vy = (remainDy / remainDist) * 1.2;
    let cx = startX, cy = startY;

    function falling() {
      vy += 0.35;
      cx += vx;
      cy += vy;
      vx *= 0.97;

      const tilt = peakAngle + vy * 2.5;
      el.style.left      = cx + 'px';
      el.style.top       = cy + 'px';
      el.style.transform = `translate(-50%,-50%) rotate(${tilt.toFixed(1)}deg)`;

      if (cy < floor) {
        requestAnimationFrame(falling);
      } else {
        el.style.top       = floor + 'px';
        el.style.transform = `translate(-50%,-50%) rotate(${(peakAngle + 20).toFixed(1)}deg)`;
      }
    }
    requestAnimationFrame(falling);
  }

  requestAnimationFrame(tryRise);
}
</script>
